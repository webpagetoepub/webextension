<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save page as ePub</title>
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 16px;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      #convert {
        width: 100%;
        padding: 10px;
        font-size: 14px;
        cursor: pointer;
      }
      #convert:disabled {
        cursor: progress;
        opacity: 0.6;
      }
      #status {
        margin-top: 10px;
        min-height: 1.4em;
        color: #444;
      }
      #status.error {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <button id="convert" type="button">Save page as ePub</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
